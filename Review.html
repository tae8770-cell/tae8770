<body>
  <header class="review-header">
    <div>
      <h1>파트너오피스 답변 검수</h1>
      <p>
        MD 피드백을 검토하고 승인된 내용만 지식데이터에 반영합니다.
      </p>
    </div>

    <nav>
      <a href="<?= appUrl ?>">챗봇</a>
      <a href="<?= appUrl ?>?page=admin">관리자</a>
    </nav>
  </header>

  <main class="review-layout">
    <aside class="review-list-panel">
      <div class="panel-title">
        <h2>검수 대기</h2>
        <button onclick="loadPendingReviews()">새로고침</button>
      </div>

      <div id="reviewList"></div>
    </aside>

    <section class="review-detail-panel">
      <div id="emptyReview">
        검수할 항목을 선택하세요.
      </div>

      <div id="reviewDetail" hidden>
        <h2 id="reviewQuestion"></h2>

        <section class="review-card">
          <h3>기존 답변</h3>
          <pre id="reviewOriginalAnswer"></pre>
        </section>

        <section class="review-card">
          <h3>MD 피드백</h3>
          <div id="reviewFeedback"></div>
        </section>

        <section class="review-card">
          <h3>검색 및 진단 정보</h3>
          <pre id="reviewDiagnostic"></pre>
        </section>

        <section class="review-card edit-card">
          <h3>승인 반영 내용</h3>

          <label>
            처리 유형
            <select id="reviewActionType">
              <option value="UPDATE_KNOWLEDGE">기존 지식 수정</option>
              <option value="CREATE_KNOWLEDGE">신규 지식 추가</option>
              <option value="FEEDBACK_ONLY">피드백만 승인</option>
            </select>
          </label>

          <label>
            대상 knowledge_id
            <input id="reviewTargetKnowledgeId">
          </label>

          <label>
            신규 knowledge_id
            <input id="reviewNewKnowledgeId">
          </label>

          <div class="two-column">
            <label>
              domain
              <input id="reviewDomain">
            </label>

            <label>
              sub_domain
              <input id="reviewSubDomain">
            </label>
          </div>

          <label>
            title
            <input id="reviewTitle">
          </label>

          <label>
            한 줄 요약
            <input id="reviewSummary">
          </label>

          <label>
            실제 메뉴 경로
            <input id="reviewMenuPath">
          </label>

          <label>
            상세답변
            <textarea id="reviewDetailText" rows="6"></textarea>
          </label>

          <label>
            처리 순서
            <textarea
              id="reviewSteps"
              rows="6"
              placeholder="한 줄에 한 단계씩 입력"
            ></textarea>
          </label>

          <label>
            주의사항
            <textarea id="reviewCaution" rows="4"></textarea>
          </label>

          <div class="two-column">
            <label>
              source_file
              <input id="reviewSourceFile">
            </label>

            <label>
              source_page
              <input id="reviewSourcePage">
            </label>
          </div>

          <label>
            관리자 검수 의견
            <textarea id="reviewComment" rows="3"></textarea>
          </label>

          <div class="review-actions">
            <button class="danger" onclick="rejectCurrentReview()">
              반려
            </button>

            <button class="primary" onclick="approveCurrentReview()">
              승인 및 반영
            </button>
          </div>
        </section>
      </div>
    </section>
  </main>
