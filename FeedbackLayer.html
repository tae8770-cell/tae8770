<style>
.feedback-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:1250;display:none}.feedback-backdrop.open{display:block}.feedback-panel{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);background:#fff;padding:24px;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.18)}.feedback-group{margin:20px 0}.feedback-options{display:flex;flex-wrap:wrap;gap:8px}.feedback-options label{border:1px solid #cbd5e1;border-radius:999px;padding:9px 12px;cursor:pointer}.feedback-fields{display:grid;gap:12px}.feedback-fields input,.feedback-fields textarea,.feedback-fields select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.feedback-success{padding:28px;text-align:center}.feedback-attachment-hint{font-size:11px;color:#737780}@media(max-width:640px){.feedback-panel{top:auto;bottom:0;right:0;width:100%;height:auto;max-height:92%;border-radius:20px 20px 0 0}}
</style>
<div id="feedbackLayer" class="feedback-backdrop" onclick="feedbackBackdrop(event)"><section class="feedback-panel" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
<button type="button" style="float:right" onclick="closeFeedbackLayer()">×</button><h2 id="feedbackTitle">사용자 피드백</h2><p>소중한 의견이 답변 품질 개선에 도움이 됩니다.</p>
<form id="feedbackForm" onsubmit="submitUserFeedback(event)"><div class="feedback-group"><strong>응답 방식</strong><div class="feedback-options"><label><input type="radio" name="responseMode" value="IDENTIFIED" checked onchange="toggleIdentityFields()"> 업체명·이름</label><label id="anonymousOption"><input type="radio" name="responseMode" value="ANONYMOUS" onchange="toggleIdentityFields()"> 익명</label></div></div>
<div id="identityFields" class="feedback-fields"><input id="feedbackCompany" maxlength="100" placeholder="업체명" required><input id="feedbackName" maxlength="50" placeholder="이름" required></div>
<div class="feedback-group"><strong>필요한 정보를 찾았나요?</strong><div class="feedback-options"><label><input required type="radio" name="informationResult" value="FOUND"> 🙂 찾았어요</label><label><input type="radio" name="informationResult" value="PARTIAL" onchange="showFeedbackDetails()"> 😐 일부만</label><label><input type="radio" name="informationResult" value="NOT_FOUND" onchange="showFeedbackDetails()"> 🙁 못 찾았어요</label></div></div>
<div class="feedback-group"><strong>업무에 도움이 되었나요?</strong><div class="feedback-options"><label><input required type="radio" name="helpfulness" value="HELPFUL"> 👍 도움됨</label><label><input type="radio" name="helpfulness" value="NEUTRAL" onchange="showFeedbackDetails()"> 🤔 보통</label><label><input type="radio" name="helpfulness" value="NOT_HELPFUL" onchange="showFeedbackDetails()"> 👎 아쉬움</label></div></div>
<div id="feedbackDetails"><div class="feedback-group"><strong>아쉬운 점 <span class="feedback-attachment-hint">(1개 이상 필수)</span></strong><div class="feedback-options" id="issueTypes"><label><input type="checkbox" value="NONE"> 없음</label><label><input type="checkbox" value="NOT_FOUND"> 정보를 못 찾음</label><label><input type="checkbox" value="INACCURATE"> 내용이 부정확함</label><label><input type="checkbox" value="INSUFFICIENT_DETAIL"> 설명이 부족함</label><label><input type="checkbox" value="MISSING_STEPS"> 처리 순서가 부족함</label><label><input type="checkbox" value="STALE_POLICY"> 정책·메뉴가 변경됨</label><label><input type="checkbox" value="NEW_KNOWLEDGE"> 새로운 지식 필요</label><label><input type="checkbox" value="NEED_SCREEN"> 관련 화면 필요</label><label><input type="checkbox" value="OTHER"> 기타</label></div></div><div class="feedback-fields"><select id="feedbackDomain"><option value="">업무 영역 선택</option><option>상품 등록</option><option>상품 승인</option><option>가격·재고</option><option>주문</option><option>배송</option><option>취소·반품·교환</option><option>정산</option><option>프로모션</option><option>계정·권한</option><option>기타</option></select><textarea id="feedbackComment" maxlength="1500" rows="4" placeholder="자세한 의견"></textarea><textarea id="feedbackCorrection" maxlength="1500" rows="3" placeholder="알고 있는 올바른 내용"></textarea><select id="feedbackReferenceDomain"><option value="">관련 문서·화면 도메인 선택</option><option>파트너오피스</option><option>이랜드몰</option><option>키디키디몰</option><option>기타</option></select><input id="feedbackReference" type="url" placeholder="관련 문서나 화면 HTTPS 링크"><input id="feedbackAttachment" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"><span class="feedback-attachment-hint">첨부 파일은 지정된 Google Drive 폴더에 저장됩니다. (최대 5MB)</span></div></div>
<div id="feedbackError" class="access-error"></div><button id="feedbackSubmit" type="submit">피드백 제출</button></form><div id="feedbackComplete" class="feedback-success" hidden><h3>의견을 남겨주셔서 감사합니다.</h3><p>지식과 답변 품질 개선에 활용하겠습니다.</p><button type="button" onclick="closeFeedbackLayer()">닫기</button></div>
</section></div>
<script>
var FEEDBACK_CONTEXT={entryPoint:'HEADER',relatedLogId:''};
function openFeedbackLayer(context){FEEDBACK_CONTEXT=context||{entryPoint:'HEADER',relatedLogId:''};document.getElementById('feedbackLayer').classList.add('open');document.getElementById('feedbackForm').hidden=false;document.getElementById('feedbackComplete').hidden=true;document.getElementById('feedbackDetails').hidden=false;document.getElementById('anonymousOption').hidden=window.SELLER_ACCESS_STATE&&!window.SELLER_ACCESS_STATE.anonymousFeedbackEnabled;document.querySelector('[name=responseMode][value=IDENTIFIED]').checked=true;toggleIdentityFields();}
function closeFeedbackLayer(){document.getElementById('feedbackLayer').classList.remove('open');}
function feedbackBackdrop(e){if(e.target.id==='feedbackLayer')closeFeedbackLayer();}
function toggleIdentityFields(){var identified=document.querySelector('[name=responseMode]:checked').value==='IDENTIFIED';document.getElementById('identityFields').hidden=!identified;document.getElementById('feedbackCompany').required=identified;document.getElementById('feedbackName').required=identified;}
function showFeedbackDetails(){document.getElementById('feedbackDetails').hidden=false;}
function readAttachment(file,done){if(!file){done(null);return;}if(file.size>5*1024*1024){done({error:'첨부 파일은 5MB 이하만 업로드할 수 있습니다.'});return;}var reader=new FileReader();reader.onload=function(){done({name:file.name,mimeType:file.type,data:reader.result});};reader.onerror=function(){done({error:'첨부 파일을 읽지 못했습니다.'});};reader.readAsDataURL(file);}
function submitUserFeedback(e){e.preventDefault();var button=document.getElementById('feedbackSubmit');var issues=Array.from(document.querySelectorAll('#issueTypes input:checked')).map(function(x){return x.value;});if(!issues.length){document.getElementById('feedbackError').textContent='아쉬운 점을 한 가지 이상 선택해 주세요. 해당 사항이 없으면 “없음”을 선택하세요.';return;}if(issues.indexOf('NONE')>=0&&issues.length>1){document.getElementById('feedbackError').textContent='“없음”은 다른 항목과 함께 선택할 수 없습니다.';return;}button.disabled=true;button.textContent='피드백을 저장하고 있습니다.';var checked=function(name){var el=document.querySelector('[name='+name+']:checked');return el?el.value:'';};readAttachment(document.getElementById('feedbackAttachment').files[0],function(attachment){if(attachment&&attachment.error){button.disabled=false;button.textContent='피드백 제출';document.getElementById('feedbackError').textContent=attachment.error;return;}var payload={sessionToken:window.SELLER_SESSION_TOKEN||'',sessionId:PAGE_SESSION_ID,relatedLogId:FEEDBACK_CONTEXT.relatedLogId||'',entryPoint:FEEDBACK_CONTEXT.entryPoint||'HEADER',responseMode:checked('responseMode'),companyName:document.getElementById('feedbackCompany').value,respondentName:document.getElementById('feedbackName').value,informationResult:checked('informationResult'),helpfulness:checked('helpfulness'),issueTypes:issues,businessDomain:document.getElementById('feedbackDomain').value,detailComment:document.getElementById('feedbackComment').value,suggestedCorrection:document.getElementById('feedbackCorrection').value,referenceDomain:document.getElementById('feedbackReferenceDomain').value,referenceUrl:document.getElementById('feedbackReference').value,attachment:attachment};google.script.run.withSuccessHandler(function(){button.disabled=false;button.textContent='피드백 제출';document.getElementById('feedbackForm').hidden=true;document.getElementById('feedbackComplete').hidden=false;}).withFailureHandler(function(err){button.disabled=false;button.textContent='피드백 제출';document.getElementById('feedbackError').textContent=err.message||String(err);}).submitChatbotReview(payload);});}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeFeedbackLayer();});
</script>
