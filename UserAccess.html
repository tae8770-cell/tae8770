<style>
.access-overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:1200;display:none;align-items:center;justify-content:center;padding:20px}.access-overlay.open{display:flex}.access-card{width:min(430px,100%);max-height:90vh;overflow:auto;background:rgba(255,255,255,.96);border:1px solid rgba(18,20,24,.1);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(20,24,32,.2)}.access-card h2{margin:0 0 8px;font-size:20px;letter-spacing:-.04em}.access-card p{color:#737780;margin:0}.access-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:22px 0 18px;padding:4px;background:#f1f2f4;border-radius:12px}.access-tabs button{border:0;border-radius:9px;padding:10px;background:transparent;color:#737780}.access-tabs button.active{background:#202329;color:#fff;box-shadow:0 3px 10px rgba(20,24,32,.12)}.access-form[hidden],.access-card [hidden]{display:none!important}.access-form{display:grid;gap:14px}.access-form label{display:grid;gap:6px;font-size:12px;font-weight:700}.access-form input{width:100%;padding:12px 13px;border:1px solid rgba(18,20,24,.14);border-radius:12px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}.access-form input:focus{border-color:#202329;box-shadow:0 0 0 3px rgba(32,35,41,.08)}.access-form button,.access-actions button{min-height:42px;border:0;border-radius:12px;background:#202329;color:#fff;font-weight:700}.access-actions{display:flex;gap:8px;margin-top:18px}.access-actions button{padding:0 16px}.access-actions button:last-child{background:#f1f2f4;color:#202329}.access-error{min-height:20px;margin-top:8px;color:#b91c1c;font-size:12px}.access-lock{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.96),transparent 45%),linear-gradient(145deg,#f3f4f6 0%,#e6e8ec 100%);z-index:1100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}.access-lock.open{display:flex}.access-welcome{width:min(520px,100%);padding:42px 34px;background:rgba(255,255,255,.84);border:1px solid rgba(18,20,24,.1);border-radius:28px;box-shadow:0 18px 50px rgba(20,24,32,.08);backdrop-filter:blur(24px)}.access-welcome .welcome-mark{width:44px;height:44px;display:grid;place-items:center;margin:0 auto 18px;border-radius:14px;background:linear-gradient(145deg,#383c44,#16181c);color:#fff;font-weight:700}.access-welcome h2{margin:0;font-size:24px;letter-spacing:-.06em}.access-welcome .welcome-lead{margin:10px 0 0;font-size:14px;color:#737780}.access-welcome .welcome-copy{margin:22px auto 26px;max-width:390px;color:#535861;line-height:1.8}.access-welcome button{min-height:44px;padding:0 24px;border:0;border-radius:12px;background:#202329;color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(20,24,32,.14)}.access-user{font-size:12px;color:#475569}.feedback-header-button,.account-header-button{width:auto;padding:0 10px;font-size:12px}
</style>
<div id="accessLock" class="access-lock"><div class="access-welcome"><div class="welcome-mark">E</div><h2>판매자 지식봇에 오신 것을 환영합니다</h2><p class="welcome-lead">판매자 업무를 더 쉽고 빠르게 해결해 보세요.</p><p class="welcome-copy">상품 등록·승인, 가격·재고, 주문·배송, 반품·교환과 고객문의 처리 방법을 찾아드립니다.<br>질문을 입력하면 관련 업무 절차와 확인사항을 근거와 함께 안내합니다.</p><button type="button" onclick="openAccountLayer('login')">로그인하고 시작하기</button><p class="welcome-lead" style="margin-top:14px">처음 이용하시나요? 로그인 화면에서 회원가입을 선택해 주세요.</p></div></div>
<div id="accountLayer" class="access-overlay" onclick="closeAccountOnBackdrop(event)"><section class="access-card" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
  <button type="button" style="float:right" onclick="closeAccountLayer()">×</button><h2 id="accountTitle">판매자 계정</h2><p id="accountStatus">로그인 후 챗봇을 사용할 수 있습니다.</p>
  <div id="accountAuthenticated" hidden><div id="accountUser" class="access-user"></div><div class="access-actions"><button type="button" onclick="logoutAccount()">로그아웃</button><button type="button" onclick="closeAccountLayer()">닫기</button></div></div>
  <div id="accountGuest">
    <div class="access-tabs"><button id="loginTabButton" class="active" type="button" onclick="showAccountTab('login')">로그인</button><button id="registerTabButton" type="button" onclick="showAccountTab('register')">회원가입</button></div>
    <form id="loginForm" class="access-form" onsubmit="submitLogin(event)"><label>계정 아이디<input id="loginEmail" type="text" required autocomplete="username"></label><label>비밀번호<input id="loginPassword" type="password" required autocomplete="current-password"></label><button type="submit">로그인</button></form>
    <form id="registerForm" class="access-form" hidden onsubmit="submitRegistration(event)"><label>계정 아이디<input id="registerEmail" type="text" minlength="3" required autocomplete="username"></label><label>비밀번호<input id="registerPassword" type="password" minlength="10" required autocomplete="new-password" placeholder="영문·숫자 포함 10자 이상"></label><label>업체명<input id="registerCompany" maxlength="100" required></label><label>이름<input id="registerName" maxlength="50" required></label><button type="submit">가입하고 로그인</button></form>
    <div id="accountError" class="access-error"></div>
  </div>
</section></div>
<script>
window.SELLER_SESSION_TOKEN=localStorage.getItem('sellerSessionToken')||'';window.SELLER_ACCESS_STATE=null;
function refreshAccessState(){google.script.run.withSuccessHandler(function(state){window.SELLER_ACCESS_STATE=state;var lock=document.getElementById('accessLock');var accountButton=document.getElementById('accountButton');lock.classList.toggle('open',state.loginRequired&&!state.authenticated);accountButton.hidden=false;accountButton.textContent=state.authenticated?'내 계정':'로그인';document.getElementById('accountGuest').hidden=state.authenticated;document.getElementById('accountAuthenticated').hidden=!state.authenticated;document.getElementById('accountStatus').textContent=state.authenticated?'로그인되어 있습니다.':(state.loginRequired?'로그인 후 챗봇을 사용할 수 있습니다.':'현재 로그인 없이 이용할 수 있습니다.');if(state.user){document.getElementById('accountUser').textContent=state.user.companyName+' · '+state.user.userName+' · '+state.user.email;}}).withFailureHandler(function(err){document.getElementById('accountError').textContent=err.message||String(err);}).getPublicAccessState(window.SELLER_SESSION_TOKEN);}
function openAccountLayer(tab){document.getElementById('accountLayer').classList.add('open');showAccountTab(tab||'login');}
function closeAccountLayer(){if(window.SELLER_ACCESS_STATE&&window.SELLER_ACCESS_STATE.loginRequired&&!window.SELLER_ACCESS_STATE.authenticated)return;document.getElementById('accountLayer').classList.remove('open');}
function closeAccountOnBackdrop(e){if(e.target.id==='accountLayer')closeAccountLayer();}
function showAccountTab(tab){document.getElementById('loginForm').hidden=tab!=='login';document.getElementById('registerForm').hidden=tab!=='register';document.getElementById('loginTabButton').classList.toggle('active',tab==='login');document.getElementById('registerTabButton').classList.toggle('active',tab==='register');document.getElementById('accountError').textContent='';}
function accountPayload(prefix){return{email:document.getElementById(prefix+'Email').value,password:document.getElementById(prefix+'Password').value,companyName:prefix==='register'?document.getElementById('registerCompany').value:'',userName:prefix==='register'?document.getElementById('registerName').value:''};}
function handleAuthSuccess(result){window.SELLER_SESSION_TOKEN=result.token;localStorage.setItem('sellerSessionToken',result.token);document.getElementById('accountLayer').classList.remove('open');refreshAccessState();}
function handleAuthError(err){document.getElementById('accountError').textContent=err.message||String(err);}
function submitLogin(e){e.preventDefault();google.script.run.withSuccessHandler(handleAuthSuccess).withFailureHandler(handleAuthError).loginSeller(accountPayload('login'));}
function submitRegistration(e){e.preventDefault();google.script.run.withSuccessHandler(handleAuthSuccess).withFailureHandler(handleAuthError).registerSeller(accountPayload('register'));}
function logoutAccount(){google.script.run.withSuccessHandler(function(){window.SELLER_SESSION_TOKEN='';localStorage.removeItem('sellerSessionToken');document.getElementById('accountLayer').classList.remove('open');refreshAccessState();}).logoutSeller(window.SELLER_SESSION_TOKEN);}
document.addEventListener('DOMContentLoaded',refreshAccessState);
</script>
